services:
  bookstack_db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ${BOOKSTACK_DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: bookstack
      MYSQL_USER: bookstack
      MYSQL_PASSWORD: ${BOOKSTACK_DB_PASSWORD:-bookstack}
    volumes:
      - bookstack_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  bookstack:
    build:
      context: .
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - APP_KEY=${BOOKSTACK_APP_KEY:-base64:6kALlUtIbZkcT6rC+93BWeosnizHnFLOpZvuNaLe0+c=}
      - APP_URL=${BOOKSTACK_URL:-http://localhost:6875}
      - DB_HOST=bookstack_db
      - DB_DATABASE=bookstack
      - DB_USERNAME=bookstack
      - DB_PASSWORD=${BOOKSTACK_DB_PASSWORD:-bookstack}
      - APP_THEME=default
    volumes:
      - bookstack_config:/config
    ports:
      - "${BOOKSTACK_PORT:-6875}:80"
    depends_on:
      bookstack_db:
        condition: service_healthy

volumes:
  bookstack_db:
  bookstack_config:
